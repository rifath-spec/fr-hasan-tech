    <!-- WhatsApp Icon & Number -->
    <g transform="translate(-105, 5)">
      <circle cx="12" cy="12" r="11" fill="none" stroke="#0F2B48" stroke-width="2.5"/>
      <path d="M 8 7.5 C 7.5 8.5 7.5 10 9 12 C 10.5 14 12.5 15 14.5 15 C 16 15 16.5 13.8 16.5 13 C 16.5 12.5 15.5 11.8 14.8 11.5 C 14.2 11.2 13.8 11.5 13.5 11.8 C 13.2 12.1 12.8 12.2 12.3 11.8 C 11.5 11 11 10.5 10.2 9.7 C 9.8 9.2 9.9 8.8 10.2 8.5 C 10.5 8.2 10.8 7.8 10.5 7.2 C 10.2 6.5 9.5 5.5 9 5.5 C 8.5 5.5 8 6.5 8 7.5 Z" fill="#0F2B48"/>
    </g>
    <text x="14" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#0F2B48" text-anchor="middle" letter-spacing="1">
      0768597800
