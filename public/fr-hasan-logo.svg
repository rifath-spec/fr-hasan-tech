<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" stroke="#E11D48" stroke-width="4"/>
  <circle cx="250" cy="250" r="236" fill="none" stroke="#0F2B48" stroke-width="6"/>

  <!-- Circuit & FR Tech Icon -->
  <g transform="translate(175, 100) scale(0.9)">
    <!-- Circuit Lines & Nodes Left (Red) -->
    <path d="M 50 15 L 20 15" stroke="#E11D48" stroke-width="7" stroke-linecap="round"/>
    <circle cx="16" cy="15" r="9" fill="#E11D48"/>

    <path d="M 50 45 L 0 45" stroke="#E11D48" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-4" cy="45" r="9" fill="#E11D48"/>

    <path d="M 50 75 L 15 75" stroke="#E11D48" stroke-width="7" stroke-linecap="round"/>
    <circle cx="11" cy="75" r="9" fill="#E11D48"/>

    <path d="M 50 105 L 30 105 L 30 145" stroke="#E11D48" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="30" cy="149" r="9" fill="#E11D48"/>

    <!-- FR Letterforms -->
    <!-- Top Navy Bar -->
    <path d="M 50 12 L 150 12 L 140 34 L 50 34 Z" fill="#0F2B48"/>
    <!-- Red F Middle Bar and Spine -->
    <path d="M 50 34 L 145 34 C 160 34 160 75 145 75 L 80 75 L 80 115 L 50 115 Z" fill="#E11D48"/>
    <!-- Navy R Leg and Curve -->
    <path d="M 90 75 L 140 75 C 150 75 155 85 145 100 L 110 115 L 85 115 Z" fill="#0F2B48"/>
    <circle cx="165" cy="112" r="9" fill="#E11D48"/>
  </g>

  <!-- Brand Typography: FR.HASAN TECH -->
  <text x="250" y="278" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#0F2B48" text-anchor="middle" letter-spacing="3">
    FR.HASAN TECH
  </text>

  <!-- Location Tag: 529, SIRAJ NAGAR, THAMPALAGAMAM -->
  <text x="250" y="302" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12.5" fill="#0F2B48" text-anchor="middle" letter-spacing="1.5">
    529, SIRAJ NAGAR, THAMPALAGAMAM
  </text>

  <!-- Divider Arc / Bottom Border Accent -->
  <path d="M 80 345 Q 250 365 420 345" stroke="#0F2B48" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.3"/>

  <!-- WhatsApp Section -->
  <g transform="translate(250, 395)">
    <text x="0" y="-14" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="19" fill="#0F2B48" text-anchor="middle" letter-spacing="1">
